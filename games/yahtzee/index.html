<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yahtzee</title>
    <link rel="icon" href="../../icons/muha-brand-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?build=20260731-screenshot-contrast-fixes">
</head>

<body>
    <h1>Yahtzee</h1>


    <div id="controls">
        <button id="rollBtn">Roll</button>
        <span>Rolls left: <span id="rollsLeft">3</span></span>
        <span id="roundPill">Round 1 / 13</span>
        <span id="statusTag"></span>
    </div>


    <div id="dice">
        <div class="die"></div>
        <div class="die"></div>
        <div class="die"></div>
        <div class="die"></div>
        <div class="die"></div>
    </div>


    <h2>Scorecard</h2>
    <div class="score-scroll">
        <table id="score-table">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
            <tfoot>
                <tr>
                    <td>Upper Subtotal</td>
                    <td id="upperSubtotal">0</td>
                </tr>
                <tr>
                    <td>Upper Bonus</td>
                    <td id="upperBonus">0</td>
                </tr>
                <tr>
                    <td>Upper Total</td>
                    <td id="upperTotal">0</td>
                </tr>
                <tr>
                    <td>Lower Total</td>
                    <td id="lowerTotal">0</td>
                </tr>
                <tr>
                    <td>Grand Total</td>
                    <td id="grandTotal">0</td>
                </tr>
            </tfoot>
        </table>
    </div>


    <div id="endOfGame" style="display:none;">
        <h2>Game Over</h2>
        <p>Your final total: <span id="finalTotal">0</span></p>
        <button id="newGameBtn">New Game</button>
    </div>

    <script src="../../interaction-lock.js?build=20260808-no-double-tap"></script>
    <script src="main.js?v=1.0.2"></script>
</body>

</html>
