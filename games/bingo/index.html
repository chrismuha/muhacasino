<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#090d16" />
    <title>Muha Bingo</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #090d16; }
      .bingo-startup-state {
        position: fixed; z-index: 20000; inset: 0; display: grid; place-items: center;
        padding: 24px; color: #f4f7ff; background: #090d16; font-family: system-ui, sans-serif;
      }
      .bingo-startup-state[hidden] { display: none; }
      .bingo-startup-card {
        width: min(480px, 100%); padding: 30px; border: 1px solid #405174;
        border-radius: 20px; text-align: center; background: #151c2b;
      }
      .bingo-startup-card h1 { margin: 0 0 10px; font-size: 22pt; }
      .bingo-startup-card p { margin: 0; color: #b6c0d4; font-size: 11pt; line-height: 1.5; }
      .bingo-startup-actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
      .bingo-startup-actions[hidden] { display: none; }
      .bingo-startup-actions button, .bingo-startup-actions a {
        min-height: 44px; padding: 10px 17px; border: 1px solid #6f83aa;
        border-radius: 999px; color: #fff; background: #275fae; font-weight: 800;
        text-decoration: none; cursor: pointer;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
      try {
        document.documentElement.dataset.bingoTheme =
          localStorage.getItem("muha-bingo-theme") === "vault"
            ? "classic"
            : localStorage.getItem("muha-bingo-theme") || "planet";
      } catch {
        document.documentElement.dataset.bingoTheme = "planet";
      }
      const bingoLaunchParameters = new URLSearchParams(location.search);
      if (bingoLaunchParameters.has("screen") || bingoLaunchParameters.has("player")) {
        document.documentElement.classList.add("bingo-popout-window");
      } else if (window.parent !== window) {
        document.documentElement.classList.add("bingo-embedded-window");
      }
    </script>
    <script src="./browser-bingo-api.js?build=20260731-classic-header-final"></script>
    <script type="module" crossorigin src="./assets/index-DsHWgouX.js?build=20260801-ball-hyphen-hash"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BIJKjhW9.css?build=20260731-classic-header-final">
    <link rel="stylesheet" href="./vault-theme.css?build=20260801-planet-hall-setup-steps">
  </head>
  <body>
    <div id="app"></div>
    <div id="bingoStartupState" class="bingo-startup-state" role="status" aria-live="polite">
      <section class="bingo-startup-card">
        <h1 id="bingoStartupTitle">Loading Muha Bingo…</h1>
        <p id="bingoStartupMessage">Preparing this Bingo window.</p>
        <div id="bingoStartupActions" class="bingo-startup-actions" hidden>
          <button id="bingoStartupReload" type="button">Reload Bingo</button>
          <a href="../../index.html#bingo">Return to casino</a>
        </div>
      </section>
    </div>
    <script src="../../interaction-lock.js?v=1.1.4"></script>
    <script src="./theme-switcher.js?build=20260731-classic-header-final"></script>
    <script src="./planet-hall-ui.js?build=20260801-planet-hall-2-mode-toggle"></script>
    <script src="./runtime-guard.js?build=20260731-classic-header-final"></script>
  </body>
</html>
