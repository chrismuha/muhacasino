name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

        with:
          fetch-depth: 0

      - name: Enforce Change Safety
        run: node scripts/check-change-safety.cjs
        env:
          CHANGE_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests If Present
        run: npm run test --if-present

      # This project has no Electron app or desktop packaging. Production web
      # assets are built only when the user explicitly requests that output.
      - name: Run Syntax Checks
        run: npm run check --if-present

      - name: Check Monopoly Deal Rules
        run: node --test games/monopoly-deal/engine.test.mjs games/monopoly-deal/ai.test.mjs
